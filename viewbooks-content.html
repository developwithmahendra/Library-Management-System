
<section class="view-books">
<div class="view-books-heading">
    <span class="view-books-icon">📚</span>
    <div>
        <h2>View Books</h2>
        <p>View all books in the library</p>
    </div>
</div>

<input
    type="text"
    id="searchBook"
    placeholder="Search books..."
    aria-label="Search books"
>

<div class="books-table-container">
    <table class="books-table">
        <thead>
            <tr>
                <th>Book ID</th>
                <th>Book Name</th>
                <th>Author</th>
                <th>Category</th>
                <th>Total Copies</th>
            </tr>
        </thead>

        <tbody id="booksList"></tbody>
    </table>
</div>


</section>

<script>
(function () {

    const list = document.getElementById("booksList");
    const search = document.getElementById("searchBook");

    if (!list || !search) return;

    function getBooks() {
        try {
            const data = JSON.parse(
                localStorage.getItem("libraryBooks") || "[]"
            );

            return Array.isArray(data) ? data : [];

        } catch (error) {
            console.error("Unable to read library books:", error);
            return [];
        }
    }

    function showBooks() {

        const books = getBooks();
        const text = search.value.trim().toLowerCase();

        const filteredBooks = books.filter(function (book) {
            return [
                book.id,
                book.name,
                book.author,
                book.category
            ].some(function (value) {
                return String(value || "")
                    .toLowerCase()
                    .includes(text);
            });
        });

        list.replaceChildren();

        if (filteredBooks.length === 0) {

            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 5;
            cell.textContent = books.length === 0
                ? "No books added yet."
                : "No books found.";

            row.appendChild(cell);
            list.appendChild(row);

            return;
        }

        filteredBooks.forEach(function (book) {

            const row = document.createElement("tr");

            [
                book.id,
                book.name,
                book.author,
                book.category,
                book.total
            ].forEach(function (value) {

                const cell = document.createElement("td");
                cell.textContent = String(value ?? "");
                row.appendChild(cell);

            });

            list.appendChild(row);

        });
    }

    search.addEventListener("input", showBooks);

    // Read the latest saved data whenever this section loads.
    showBooks();

})();
</script>
