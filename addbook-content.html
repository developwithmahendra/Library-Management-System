<section class="add-book">
    
    <div class="add-book-heading">
        <div class="book-icon">
            <img src="images/library 3 add logo.png" alt="Library Logo">
        </div>

        <div>
            <h2>Add Book</h2>
            <p>Enter book details to add</p>
        </div>
    </div>

    <form id="bookForm">
        <div class="form-row">
            <label for="bookId">Book ID</label>
            <input type="text" id="bookId" placeholder="e.g. B001" required>
        </div>

        <div class="form-row">
            <label for="bookName">Book Name</label>
            <input type="text" id="bookName" placeholder="e.g. Python Programming" required>
        </div>

        <div class="form-row">
            <label for="author">Author</label>
            <input type="text" id="author" placeholder="e.g. John Doe" required>
        </div>

        <div class="form-row">
            <label for="category">Category</label>

            <select id="category" required>
                <option value="">Select Category</option>
                <option>Computer Science</option>
                <option>Science</option>
                <option>Mathematics</option>
                <option>Literature</option>
                <option>History</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-row">
            <label for="copies">Total Copies</label>
            <input type="number" id="copies" placeholder="e.g. 5" min="1" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="add-btn">Add Book</button>
            <button type="reset" class="reset-btn">Reset</button>
        </div>

        <p id="bookMessage" aria-live="polite"></p>

    </form>

</section>

<script>
    (function () {

        const form = document.getElementById("bookForm");

        if (!form) return;

        form.addEventListener("submit", function (event) {

            event.preventDefault();

            const book = {
                id: document.getElementById("bookId").value.trim(),
                name: document.getElementById("bookName").value.trim(),
                author: document.getElementById("author").value.trim(),
                category: document.getElementById("category").value,
                total: Number(document.getElementById("copies").value),
                available: Number(document.getElementById("copies").value)
            };

            let books = [];

            try {
                books = JSON.parse(localStorage.getItem("libraryBooks")) || [];
            } catch (error) {
                books = [];
            }

            const message = document.getElementById("bookMessage");

            if (books.some(function (item) {
                return item.id.toLowerCase() === book.id.toLowerCase();
            })) {
                message.textContent = "This Book ID already exists!";
                message.style.color = "#dc2626";
                return;
            }

            books.push(book);

            localStorage.setItem("libraryBooks", JSON.stringify(books));

            message.textContent = "Book added successfully!";
            message.style.color = "#15803d";

            form.reset();

        });

    })();
</script>
